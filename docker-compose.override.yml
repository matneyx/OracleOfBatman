# Automatically merged in by `docker compose up` for local development:
# source-mounted, hot-reloading versions of each service instead of the
# production-shaped builds in docker-compose.yml.
services:
  api:
    build:
      target: base
    working_dir: /app
    volumes:
      - .:/app
      - api-cargo-target:/app/target
    command: cargo run --bin api
    environment:
      RUST_LOG: ${RUST_LOG:-debug}

  frontend:
    build:
      target: base
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Vite's dev server, not the port-80 nginx server from the prod build.
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  ingest:
    build:
      target: base
    working_dir: /app
    volumes:
      - .:/app
      - ingest-cargo-target:/app/target
    command: cargo run --bin ingest

volumes:
  api-cargo-target:
  ingest-cargo-target:
