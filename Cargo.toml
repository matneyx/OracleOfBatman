[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/ingest",
    "crates/e2e",
]

# Tiger Style, adapted for Rust — see /docs/STYLE.md for the full ruleset and
# what's deliberately dropped/reinterpreted from the original.
[workspace.lints.clippy]
too_many_lines = "warn"   # hard limit is 70 lines; threshold set in clippy.toml
unwrap_used = "warn"      # errors must be handled explicitly, not silently panicked past
