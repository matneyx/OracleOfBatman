services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-8080}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - api

  ingest:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: crates/ingest/Dockerfile
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      COMIC_VINE_API_KEY: ${COMIC_VINE_API_KEY}
    depends_on:
      - neo4j

volumes:
  neo4j-data:
