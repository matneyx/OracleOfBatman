[package]
name = "ingest"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "ingest"
path = "src/lib.rs"

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
tokio = { version = "1", features = ["full"] }
neo4rs = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
