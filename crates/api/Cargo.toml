[package]
name = "api"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
neo4rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
